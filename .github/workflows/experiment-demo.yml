name: Train demo and generate research plots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Train both models and generate graphs
        run: |
          python scripts/run_suite.py --steps 100 --batch-size 8 --seq-len 32 --seeds 42 --lengths 16 32 64 128 256
      - name: Upload checkpoints, metrics and plots
        uses: actions/upload-artifact@v4
        with:
          name: titans-miras-demo-results
          path: |
            runs/
            reports/
          if-no-files-found: error
          retention-days: 14
